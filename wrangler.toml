name = "jina-recorder"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 화면 파일(public 폴더)은 Cloudflare가 바로 내보내고,
# /api 와 /auth 로 시작하는 주소만 서버 코드가 처리한다.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

# schema.sql 을 코드 안에 글자로 넣어서, 사이트가 켜질 때 DB 표를 스스로 만든다.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# 기록·사용자·설정이 들어가는 DB.
# database_id 가 없으면 Cloudflare가 처음 올릴 때 새 DB를 만들어 연결한다.
[[d1_databases]]
binding = "DB"
database_name = "jina-recorder-db"

# 원본 녹음 저장소(R2)는 녹음을 실제로 쓰는 파트 2에서 붙인다.

# 비밀값 (코드에 넣지 않고 Cloudflare에 따로 저장) — .dev.vars.example 참고
#   ENC_KEY   — 설정에 저장하는 API 키를 잠그는 열쇠 (16자 이상 아무 문장, 한 번 정하면 바꾸지 않기)
#   SETUP_KEY — 처음 설치 화면에서 한 번 쓰는 설치 코드
